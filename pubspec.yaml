name: roam_graph_mobile
description: Browse my org-roam node graph on Android, offline and without Emacs.
publish_to: 'none'

# The release workflow overrides this with --build-name and --build-number,
# so every APK it builds has a higher version than the one before.
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # SHA-1 of file contents, as org-roam's files.hash.
  crypto: ^3.0.6
  # The app's private folder for the database.
  path_provider: ^2.1.5
  # SQLite for the org-roam database (#5); sqlite3_flutter_libs bundles
  # SQLite into the APK.
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.32
  # 14.0.0 brings the LaTeX callbacks loadLatexInline and loadLatexBlock
  # and drops flutter_tex_js (amake/org_flutter#23, for #308).
  org_flutter: ^14.0.0
  # Finds a heading node's text by its ID, for sharing it (#41); the parser
  # behind org_flutter.
  org_parser: ^12.0.1
  material_ui: ^1.7.0
  unorm_dart: ^0.3.3
  highlighting: ^0.9.0+11.8.0
  flutter_svg: ^2.3.0
  vector_graphics_compiler: ^1.3.2
  # Mermaid diagrams without a result image (#49, decision 41): parsed and
  # laid out in Dart, drawn with a CustomPainter; no WebView.
  mermaid_flutter: ^0.3.0
  mermaid_core: ^0.3.0
  # API keys of the AI chat (#59), in Android's Keystore-backed storage.
  flutter_secure_storage: ^11.2.0
  # The notes folder on the desktop (#116): the system's folder picker.
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  # HTTP client for checking updates (#247).
  http: ^1.2.2
  # Path manipulation for finding install.sh (#247).
  path: ^1.9.0
  # PlantUML diagrams without a result image (#283, decision 151): parsed,
  # laid out and drawn in Dart; no server, no WebView. Young package: its
  # use is kept in lib/node_view/plantuml.dart, easy to update or remove.
  # From the owner's fork, pinned to a commit (decision 164): upstream
  # (battlecook/puml_canvas) has had no commit since May 2026. On top
  # of 0.13.0 the fork draws the edges of activity `while` loops
  # (ChristianGeng/puml_canvas#12), places notes in class and sequence
  # diagrams (ChristianGeng/puml_canvas#13) and takes an optional
  # fontFamily (ChristianGeng/puml_canvas#1, upstream battlecook/puml_canvas#3).
  # Back to pub.dev once upstream releases these fixes.
  puml_canvas:
    git:
      url: https://github.com/ChristianGeng/puml_canvas.git
      ref: b1634775327be0222a7b3e161cd68a01396c0ba8
  # Every LaTeX formula, inline and block, drawn by the app on every
  # platform through org_flutter's loadLatexInline and loadLatexBlock
  # (#308, decisions 157 and 162). katex draws the box tree of katex_dart
  # (a port of KaTeX to Dart, which mermaid_core uses too); the app calls
  # katex_dart itself to check a formula and keep its layout. Young
  # packages: their use is kept in lib/node_view/drawn_latex.dart.
  # Both from the owner's fork of the katex monorepo, pinned to a commit
  # (decision 164): upstream (orestesgaolin/katex) has had no commit
  # since July 2026. On top of katex 1.0.0 and katex_dart 0.1.1 the fork sets
  # nested superscripts and subscripts at the script size
  # (ChristianGeng/katex#3, upstream PR orestesgaolin/katex#9) and aligns
  # the columns of array and align (ChristianGeng/katex#5, from upstream
  # PR orestesgaolin/katex#7). Back to pub.dev once upstream releases
  # these fixes.
  katex:
    git:
      url: https://github.com/ChristianGeng/katex.git
      path: packages/katex
      ref: 128bec1171db0a6c1e5816de6a2a01a82fb4d8d2
  katex_dart:
    git:
      url: https://github.com/ChristianGeng/katex.git
      path: packages/katex_dart
      ref: 128bec1171db0a6c1e5816de6a2a01a82fb4d8d2
# katex asks for katex_dart from pub.dev; the fork's own
# pubspec_overrides.yaml does not apply to a dependency, so the app
# overrides it with the same fork commit as above.
dependency_overrides:
  katex_dart:
    git:
      url: https://github.com/ChristianGeng/katex.git
      path: packages/katex_dart
      ref: 128bec1171db0a6c1e5816de6a2a01a82fb4d8d2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The help pages (#62), and the changelog the About page shows (#207).
  assets:
    - assets/help/
    - CHANGELOG.md

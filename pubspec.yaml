name: roam_graph_mobile
description: Browse my org-roam node graph on Android, offline and without Emacs.
publish_to: 'none'

# The release workflow overrides this with --build-name and --build-number,
# so every APK it builds has a higher version than the one before.
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # SHA-1 of file contents, as org-roam's files.hash.
  crypto: ^3.0.6
  # The app's private folder for the database.
  path_provider: ^2.1.5
  # SQLite for the org-roam database (#5); sqlite3_flutter_libs bundles
  # SQLite into the APK.
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.32
  org_flutter: ^13.4.2
  # Finds a heading node's text by its ID, for sharing it (#41); the parser
  # behind org_flutter.
  org_parser: ^12.0.1
  material_ui: ^1.7.0
  unorm_dart: ^0.3.3
  highlighting: ^0.9.0+11.8.0
  flutter_svg: ^2.3.0
  vector_graphics_compiler: ^1.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_tex_js: ^7.0.0

flutter:
  uses-material-design: true

# Temporary: Mistral tool choice and follow-up checks (#181). Not for main.
name: Probe 181
on:
  push:
    branches: [probe-181]
permissions:
  contents: read
env:
  KEY: ${{ secrets.MISTRAL_API_KEY }}
  M: https://api.mistral.ai/v1
  INS: Use the image generation tool to make the image the user describes.
  INS3: >-
    Use the image generation tool to make the image the user describes.
    Do this also when the request contains data, sources or links. Do not
    answer with text or links instead of an image.
  PROMPT: >-
    Erstelle eine Infografik über die Entwicklung der Leitzinsen der fiktiven
    Beispiel-Zentralbank in den letzten fünf Jahren. Daten (Jahresende):
    2020: 0,00 %, 2021: 0,00 %, 2022: 2,50 %, 2023: 4,50 %, 2024: 3,15 %,
    2025: 2,15 %. Hypothekenzinsen (10 Jahre): 2020: 1,1 %, 2021: 1,2 %,
    2022: 3,6 %, 2023: 4,0 %, 2024: 3,5 %, 2025: 3,6 %. Liniendiagramm mit
    beschrifteten Punkten, Titel "Zinsentwicklung 2020-2025", kurze
    Erklärung: Anstieg 2022 wegen hoher Inflation, Senkungen ab 2024.
    Quellen: [EZB Leitzinsen](https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html),
    [Bundesbank Zinsstatistik](https://www.bundesbank.de/de/statistiken/geld-und-kapitalmaerkte/zinssaetze-und-renditen),
    https://www.ecb.eu/press/pr/date/2024/html/index.en.html.
defaults:
  run:
    shell: bash {0}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Helpers
        run: |
          cat > /tmp/h.sh <<'SH'
          clean() { tr '\n\r' '  ' | sed -E 's#(https://[^?"\\ )]+)\?[^"\\ )]*#\1?SIG#g' | head -c 3000 | sed 's/%/%25/g'; }
          note() { t=$(printf '%s' "$2" | clean); echo "::notice title=$1::$t"; }
          H=(-H "Authorization: Bearer $KEY" -H "Content-Type: application/json")
          summary='{conversation_id, n_tool:([.outputs[]?|select(.type=="tool.execution")]|length), types:[.outputs[]?.type], tool:[[.outputs[]?|select(.type=="tool.execution")][0:1][]|{name,function,arguments:((.arguments//"")|tostring|.[0:150]),result:((.info.result//"")|tostring|.[0:200])}], text:[.outputs[]?|select(.type=="message.output")|.content|(if type=="string" then . else tostring end)|.[0:500]], error:(.message // .detail // .error // null)}'
          mkagent() { curl -sS $M/agents "${H[@]}" -d "$(jq -nc --arg ins "${2:-$INS}" --argjson ca "$1" '{model:"mistral-medium-latest",name:"probe-181",instructions:$ins,tools:[{type:"image_generation"}]} + (if $ca == null then {} else {completion_args:$ca} end)')"; }
          converse() { curl -sS $M/conversations "${H[@]}" -d "$(jq -nc --arg id "$1" --arg p "${3:-$PROMPT}" --argjson extra "$2" '{agent_id:$id,inputs:$p} + $extra')"; }
          SH
      - name: d2) replay carries the history
        run: |
          . /tmp/h.sh
          id=$(mkagent null "$INS3" | jq -r .id)
          replay() { curl -sS -w '\nHTTP %{http_code}' $M/conversations "${H[@]}" -d "$(jq -nc --arg id "$id" --arg u "$1" --arg a "$2" --arg n "$3" '{agent_id:$id,store:false,inputs:[{type:"message.input",role:"user",content:$u},{type:"message.output",role:"assistant",content:$a},{type:"message.input",role:"user",content:$n}]}')"; }
          r=$(replay 'My favourite colour is green. Do not make an image.' 'Noted.' 'What is my favourite colour? Answer in one word, and do not make an image.')
          note "d2 context $(echo "$r" | tail -1)" "$(echo "$r" | sed '$d' | jq -c "$summary")"
          sleep 20
          r=$(replay "$PROMPT" 'Die Daten stammen aus [EZB Leitzinsen](https://www.ecb.europa.eu/stats/key_ecb_interest_rates) und der Bundesbank.' 'Use the image generation tool now.')
          note "d2 retry after text $(echo "$r" | tail -1)" "$(echo "$r" | sed '$d' | jq -c "$summary")"
          note "d2 retry raw shape" "$(echo "$r" | sed '$d' | jq -c '{object, keys:keys, outputs:[.outputs[]?|{object,type,name,function,role,content_type:(.content|type), info_keys:(.info|keys?)}]}')"
      - name: Clean up
        if: always()
        run: |
          . /tmp/h.sh
          n=0
          for id in $(curl -sS "$M/agents?page_size=100" "${H[@]}" | jq -r '.[]? | select(.name=="probe-181") | .id'); do
            code=$(curl -sS -X DELETE $M/agents/$id "${H[@]}" -o /dev/null -w '%{http_code}'); n=$((n+1)); echo "$id $code"
          done
          left=$(curl -sS "$M/agents?page_size=100" "${H[@]}" | jq -c '[.[]? | select(.name=="probe-181") | .id]')
          note "cleanup" "deleted calls: $n; probe agents left: $left"

# Temporary: Mistral tool choice and follow-up checks (#181). Not for main.
name: Probe 181
on:
  push:
    branches: [probe-181]
permissions:
  contents: read
env:
  KEY: ${{ secrets.MISTRAL_API_KEY }}
  M: https://api.mistral.ai/v1
  INS: Use the image generation tool to make the image the user describes.
  INS3: >-
    Use the image generation tool to make the image the user describes.
    Do this also when the request contains data, sources or links. Do not
    answer with text or links instead of an image.
  PROMPT: >-
    Erstelle eine Infografik über die Entwicklung der Leitzinsen der fiktiven
    Beispiel-Zentralbank in den letzten fünf Jahren. Daten (Jahresende):
    2020: 0,00 %, 2021: 0,00 %, 2022: 2,50 %, 2023: 4,50 %, 2024: 3,15 %,
    2025: 2,15 %. Hypothekenzinsen (10 Jahre): 2020: 1,1 %, 2021: 1,2 %,
    2022: 3,6 %, 2023: 4,0 %, 2024: 3,5 %, 2025: 3,6 %. Liniendiagramm mit
    beschrifteten Punkten, Titel "Zinsentwicklung 2020-2025", kurze
    Erklärung: Anstieg 2022 wegen hoher Inflation, Senkungen ab 2024.
    Quellen: [EZB Leitzinsen](https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html),
    [Bundesbank Zinsstatistik](https://www.bundesbank.de/de/statistiken/geld-und-kapitalmaerkte/zinssaetze-und-renditen),
    https://www.ecb.eu/press/pr/date/2024/html/index.en.html.
defaults:
  run:
    shell: bash {0}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Helpers
        run: |
          cat > /tmp/h.sh <<'SH'
          clean() { tr '\n\r' '  ' | sed -E 's#(https://[^?"\\ )]+)\?[^"\\ )]*#\1?SIG#g' | head -c 3000 | sed 's/%/%25/g'; }
          note() { t=$(printf '%s' "$2" | clean); echo "::notice title=$1::$t"; }
          H=(-H "Authorization: Bearer $KEY" -H "Content-Type: application/json")
          summary='{conversation_id, n_tool:([.outputs[]?|select(.type=="tool.execution")]|length), types:[.outputs[]?.type], tool:[[.outputs[]?|select(.type=="tool.execution")][0:1][]|{name,function,arguments:((.arguments//"")|tostring|.[0:150]),result:((.info.result//"")|tostring|.[0:200])}], text:[.outputs[]?|select(.type=="message.output")|.content|(if type=="string" then . else tostring end)|.[0:500]], error:(.message // .detail // .error // null)}'
          mkagent() { curl -sS $M/agents "${H[@]}" -d "$(jq -nc --arg ins "${2:-$INS}" --argjson ca "$1" '{model:"mistral-medium-latest",name:"probe-181",instructions:$ins,tools:[{type:"image_generation"}]} + (if $ca == null then {} else {completion_args:$ca} end)')"; }
          converse() { curl -sS $M/conversations "${H[@]}" -d "$(jq -nc --arg id "$1" --arg p "${3:-$PROMPT}" --argjson extra "$2" '{agent_id:$id,inputs:$p} + $extra')"; }
          SH
      - name: d) follow-up in a stored conversation, and a replay
        run: |
          . /tmp/h.sh
          sleep 90
          id=$(mkagent null | jq -r .id)
          c=$(converse "$id" '{"store":true}' 'Tell me in one sentence what the ECB is. Do not make an image.')
          note "d first store=true" "$(echo "$c" | jq -c "$summary")"
          note "d first raw shape" "$(echo "$c" | jq -c '{keys:keys, outputs:[.outputs[]?|{object,type,role,agent_id,model,id,content_type:(.content|type)}]}')"
          cid=$(echo "$c" | jq -r '.conversation_id // empty')
          T=$(echo "$c" | jq -r '[.outputs[]?|select(.type=="message.output")|.content|if type=="string" then . else tostring end]|join(" ")')
          if [ -n "$cid" ]; then
            f=$(curl -sS -w '\nHTTP %{http_code}' $M/conversations/$cid "${H[@]}" -d '{"inputs":"Use the image generation tool now.","store":true}')
            body=$(echo "$f" | sed '$d')
            note "d follow-up $(echo "$f" | tail -1)" "$(echo "$body" | jq -c "$summary")"
            note "d follow-up raw shape" "$(echo "$body" | jq -c '{object, keys:keys, outputs:[.outputs[]?|{object,type,name,function,role,agent_id,model,content_type:(.content|type), info_keys:(.info|keys?)}]}')"
            note "d delete conversation" "$(curl -sS -X DELETE $M/conversations/$cid "${H[@]}" -o /dev/null -w '%{http_code}')"
          fi
          sleep 20
          r=$(curl -sS -w '\nHTTP %{http_code}' $M/conversations "${H[@]}" -d "$(jq -nc --arg id "$id" --arg t "${T:-The ECB is the central bank of the euro area.}" '{agent_id:$id,store:false,inputs:[{type:"message.input",role:"user",content:"Tell me in one sentence what the ECB is. Do not make an image."},{type:"message.output",role:"assistant",content:$t},{type:"message.input",role:"user",content:"Use the image generation tool now."}]}')")
          note "d replay store=false $(echo "$r" | tail -1)" "$(echo "$r" | sed '$d' | jq -c "$summary")"
      - name: i) milder instructions, loops counted
        run: |
          . /tmp/h.sh
          sleep 30
          id=$(mkagent null "$INS3" | jq -r .id)
          note "i German prompt run 1" "$(converse "$id" '{"store":false}' | jq -c "$summary")"
          sleep 30
          note "i German prompt run 2" "$(converse "$id" '{"store":false}' | jq -c "$summary")"
          sleep 30
          note "i red circle" "$(converse "$id" '{"store":false}' 'A red circle on a white background' | jq -c "$summary")"
          sleep 30
          old=$(mkagent null | jq -r .id)
          p=$(curl -sS -w '\nHTTP %{http_code}' -X PATCH $M/agents/$old "${H[@]}" -d "$(jq -nc --arg i "$INS3" '{instructions:$i}')")
          note "i PATCH old agent $(echo "$p" | tail -1)" "$(echo "$p" | sed '$d' | jq -c '{version, instructions:(.instructions|.[0:60]), tools}')"
          note "i patched agent, red circle" "$(converse "$old" '{"store":false}' 'A red circle on a white background' | jq -c "$summary")"
      - name: r) tool_choice required set by PATCH
        run: |
          . /tmp/h.sh
          sleep 30
          id=$(mkagent null | jq -r .id)
          p=$(curl -sS -X PATCH $M/agents/$id "${H[@]}" -d '{"completion_args":{"tool_choice":"required"}}')
          note "r PATCH" "$(echo "$p" | jq -c '{version, tc:(.completion_args.tool_choice)}')"
          note "r red circle" "$(converse "$id" '{"store":false}' 'A red circle on a white background' | jq -c "$summary")"
      - name: Clean up
        if: always()
        run: |
          . /tmp/h.sh
          n=0
          for id in $(curl -sS "$M/agents?page_size=100" "${H[@]}" | jq -r '.[]? | select(.name=="probe-181") | .id'); do
            code=$(curl -sS -X DELETE $M/agents/$id "${H[@]}" -o /dev/null -w '%{http_code}'); n=$((n+1)); echo "$id $code"
          done
          left=$(curl -sS "$M/agents?page_size=100" "${H[@]}" | jq -c '[.[]? | select(.name=="probe-181") | .id]')
          note "cleanup" "deleted calls: $n; probe agents left: $left"

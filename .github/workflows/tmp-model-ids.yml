name: tmp model ids
on:
  push:
    branches: [check/model-ids-190]
permissions:
  contents: read
jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        shell: bash
        run: |
          curl -sS https://ai-gateway.vercel.sh/v1/models -o v.json
          curl -sS https://openrouter.ai/api/v1/models -o o.json
      - name: Vercel
        shell: bash
        run: |
          jq -r '.data[] | select(.id|test("gpt-image|dall|imagen|nano-banana|gemini-.*image|recraft|ideogram|seedream|grok.*image")) | "\(.id) type=\(.type) img=\(.pricing.image // "") in=\(.pricing.input // "") out=\(.pricing.output // "") reg=\((.regions // [])|join(","))"' v.json | sort | paste -sd'|' - | fold -w 3500 | while read -r l; do echo "::notice title=vercel img::$l"; done
          jq -r '.data[] | select(.id|test("^openai/gpt-image")) | "\(.id) tags=\((.tags // [])|join(","))"' v.json | paste -sd'|' - | while read -r l; do echo "::notice title=vercel gptimage::$l"; done
      - name: OR image
        shell: bash
        run: |
          jq -r '.data[] | select(.architecture.output_modalities|index("image")) | "\(.id) out=\(.architecture.output_modalities|join("+")) p=\(.pricing.prompt) c=\(.pricing.completion) img=\(.pricing.image // "") img_out=\(.pricing.image_output // "")"' o.json | sort | paste -sd'|' - | fold -w 3500 | while read -r l; do echo "::notice title=or image::$l"; done
      - name: OR exact
        shell: bash
        run: |
          for id in anthropic/claude-sonnet-5.5 anthropic/claude-opus-5.5 anthropic/claude-haiku-5.5 google/gemini-2.5-flash-image openai/gpt-image-2 openai/gpt-image-1-mini deepseek/deepseek-v4-pro deepseek/deepseek-v4.1-flash mistralai/mistral-large-4 mistralai/mistral-medium-3.5 google/gemini-2.5-flash google/gemini-3.6-flash openai/gpt-5.4-mini openai/gpt-5.4-nano; do
            jq -r --arg id "$id" '.data[] | select(.id==$id) | "\(.id) tools=\(.supported_parameters|index("tools")!=null) p=\(.pricing.prompt|tonumber*1000000) c=\(.pricing.completion|tonumber*1000000) img=\(.pricing.image // "") out=\(.architecture.output_modalities|join("+"))"' o.json | grep . || echo "$id MISSING"
          done | paste -sd'|' - | while read -r l; do echo "::notice title=or exact::$l"; done
      - name: OR cheap tools
        shell: bash
        run: |
          jq -r '.data[] | select(.supported_parameters|index("tools")) | select(.architecture.output_modalities==["text"]) | select(.id|test(":free")|not) | select((.pricing.completion|tonumber) > 0) | [.id, ((.pricing.prompt|tonumber)*1000000), ((.pricing.completion|tonumber)*1000000)] | @tsv' o.json | sort -t$'\t' -k3 -g | awk -F'\t' '$3<1.0 {printf "%s %.3f/%.3f|", $1,$2,$3}' | fold -w 3500 | while read -r l; do echo "::notice title=or cheap tools::$l"; done

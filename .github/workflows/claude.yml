name: Claude
# A comment with "@claude" on an issue or a pull request (also in a review
# or a review comment) starts Claude, for example "@claude review this pull
# request" (decision 145, #281). Only users with write access can start it;
# the action checks this. The owner is the only such user, and he starts
# Claude only on his own issues and pull requests, so the text Claude reads
# comes from him. The Claude GitHub app must be installed.
#
# Token: the repository secret CLAUDE_CODE_OAUTH_TOKEN, made with
# `claude setup-token`; it uses the owner's Pro subscription. No
# ANTHROPIC_API_KEY: that is billed per token.
#
# Pull requests from forks: the first step of the job refuses every event
# on a fork's pull request (comment, review or review comment), in addition
# to GitHub withholding secrets from fork review events.
#
# No concurrency group: GitHub keeps one pending run per group and drops
# the older pending ones, so a burst of requests on one thread would lose
# some. Runs on one pull request may therefore overlap; a push that loses
# the race fails instead of overwriting.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Refuse pull requests from forks
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head" != "$GH_REPO" ]; then
            echo "::error::Claude does not run on pull requests from forks ($head)."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - name: Run Claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

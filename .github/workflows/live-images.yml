# Live image tests with real keys (#168, decision 105).
#
# test/live/images_live_test.dart calls the app's real image code for
# Mistral (a short prompt and a long infographic prompt), the Vercel AI
# Gateway (Images API with the cheapest image-only model, and chat with
# google/gemini-2.5-flash-image) and OpenRouter (google/gemini-2.5-flash-image).
# It costs a few cents per run, so it runs only:
#
# - once a week, Monday 06:00 UTC, on main: if a case fails, the issue "Live
#   image test failed" is opened, or commented on when it is open already;
# - by hand (workflow_dispatch), for example after a new key: the same;
# - at a full release (workflow_call from build.yml), when image code
#   changed since the previous full release: warn only. The release is
#   still published; its notes start with a line that names the failed
#   cases.
#
# The result of each case is an annotation of the "live" job (read it on the
# run's page or through the check run's annotations). A key is never printed:
# the test replaces every key in its output, and GitHub masks secrets too.
#
# The keys are repository secrets: MISTRAL_API_KEY, VERCEL_AI_GATEWAY_API_KEY
# and OPENROUTER_API_KEY. Pull requests never get them: no pull request
# starts this workflow. See docs/releases.md.
#
# Actions are pinned to full commit SHAs, as in build.yml.

name: Live images

on:
  workflow_call:
    inputs:
      warn-only:
        description: Do not fail and do not open an issue; only report the failed cases
        type: boolean
        default: false
    outputs:
      failed:
        description: The failed cases, comma separated; empty when all passed
        value: ${{ jobs.live.outputs.failed }}
      url:
        description: The link to this run
        value: ${{ jobs.live.outputs.url }}
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # The same Flutter as build.yml. Update the two together.
  FLUTTER_VERSION: 3.47.7

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.report.outputs.failed }}
      url: ${{ steps.report.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run the live tests
        # The keys are in this step only. A failed case does not stop the
        # job here: the next step reports each case first.
        id: tests
        shell: bash
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIVE_RESULTS: ${{ runner.temp }}/live-results.tsv
        run: |
          status=0
          flutter test --tags live --reporter expanded \
            test/live/images_live_test.dart || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report each case
        id: report
        if: always()
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/live-results.tsv
          TEST_STATUS: ${{ steps.tests.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=""
          if [ -f "$RESULTS" ]; then
            while IFS=$'\t' read -r name status detail; do
              # Workflow commands need % escaped.
              detail=${detail//'%'/'%25'}
              if [ "$status" = passed ]; then
                echo "::notice title=Live image test::$name passed: $detail"
              else
                echo "::error title=Live image test::$name FAILED: $detail"
                failed="${failed:+$failed, }$name"
              fi
            done < "$RESULTS"
          fi
          if [ -z "$failed" ] && [ "${TEST_STATUS:-1}" != 0 ]; then
            # The tests failed or did not run, and no case says so.
            failed="the test run itself"
            echo "::error title=Live image test::The live tests did not finish. See the log."
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "Failed: ${failed:-none}"

      - name: Keep the results for the issue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-results
          path: ${{ runner.temp }}/live-results.tsv
          if-no-files-found: ignore

      - name: Fail the job
        # Called from a release: warn only.
        if: always() && steps.report.outputs.failed != '' && inputs.warn-only != true
        run: exit 1

  issue:
    # Weekly and manual runs open the issue, or comment on the open one.
    needs: live
    if: always() && needs.live.outputs.failed != '' && inputs.warn-only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: live-results

      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.live.outputs.failed }}
          RUN_URL: ${{ needs.live.outputs.url }}
          TITLE: Live image test failed
        run: |
          {
            echo "Failed: $FAILED"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Errors (keys masked):"
            echo
            echo '```'
            if [ -f live-results.tsv ]; then
              awk -F '\t' '$2 == "failed" { print $1 ": " $3 }' live-results.tsv
            else
              echo "No result file: the tests did not finish. See the run."
            fi
            echo '```'
          } > body.md
          number=$(gh issue list --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

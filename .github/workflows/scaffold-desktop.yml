# One-off (#116): generates the Linux, Windows and macOS project folders
# with the pinned Flutter, as the SDK runs only in CI, and commits them to
# this branch. Then this workflow is removed.
name: Scaffold desktop

on:
  push:
    branches: [desktop-scaffold]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Generate the desktop folders
        run: |
          flutter create --platforms=linux,windows,macos \
            --org io.github.christiangeng --project-name roam_graph_mobile .
          git status --short
      - name: Commit them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux windows macos
          git commit -m "Desktop project folders from flutter create 3.47.7 (#116)"
          git push

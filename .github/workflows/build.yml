# Tests and builds the app.
#
# - Pull requests: run the tests and build a debug-signed APK, to check that
#   the change builds. Nothing is published.
# - Push to main: build a release APK signed with the release key and publish
#   it as a GitHub release. Obtainium installs and updates from these releases.
#
# The release key comes from four repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Every release must be signed with the same key, or Android refuses to
# install an update over the old version.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the Android project files match the Flutter that builds them.
  # Update the two together.
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set the version
        id: version
        # The run number grows with every run, so each release has a higher
        # version code and installs as an update.
        run: |
          echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Load the release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The repository secret ANDROID_KEYSTORE_BASE64 is missing. See docs/releases.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "roam-graph-${{ steps.version.outputs.name }}.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: roam-graph-${{ steps.version.outputs.name }}
          path: roam-graph-*.apk

      - name: Publish the GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "roam-graph-${{ steps.version.outputs.name }}.apk" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.name }}" \
            --notes "Built from ${{ github.sha }}."

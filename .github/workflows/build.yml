# Tests and builds the app (#167, decision 100).
#
# - Pull requests, and any branch other than main: run the tests and build a
#   debug-signed APK and the desktop apps, to check that the change builds.
#   Nothing is published, and the release key is never loaded.
# - main (a merge, or a manual run on main): build a release APK signed with
#   the release key and publish it alone as a GitHub pre-release
#   v<next patch>-dev.<run number>. Obtainium installs it when "Include
#   prereleases" is on.
# - A full release: a manual run on main with "release" checked. It builds
#   all four platforms and publishes them as the latest release
#   v<major>.<minor>.<patch>, the last full release raised by "bump", or
#   "version". Only this kind reaches install.sh --update.
#
# The release key comes from four repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Every release must be signed with the same key, or Android refuses to
# install an update over the old version.
#
# Actions are pinned to full commit SHAs (the comment names the release), so
# a moved tag cannot run new code next to the signing key. Update them on
# purpose.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Make a full release with all platforms (only on main)
        type: boolean
        default: false
      bump:
        description: The step from the last full release
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or the version itself, for example 1.0.0 (higher than the last full release)
        type: string
        default: ''

# Read-only by default. Only the release job below may write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request makes the older run useless; on main
  # each run builds a release, which must not stop half-way (decision 80).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so the Android project files match the Flutter that builds them.
  # Update the two together.
  FLUTTER_VERSION: 3.47.7
  # True only for code that is already on main. Branch and pull request code
  # never sees the release key.
  IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  version:
    # The version and the kind of build, in a job of its own, so that
    # build, linux, windows and macos need only this job and start together
    # (#166, decision 99). tool/release_version.dart computes the version
    # from the published releases (#167, decision 100). The version code is
    # the run number: it grows with every run of either kind, so each
    # release installs as an update. A re-run keeps its number and, as only
    # the releases made before this job first ran count, its version.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read when this job first ran.
      actions: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ github.run_number }}
      # full (a full release), prerelease (a merge to main) or test
      # (pull requests and other branches: nothing is published).
      kind: ${{ steps.kind.outputs.kind }}
      # The release whose CHANGELOG.md the release notes compare with.
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Choose the kind of build
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$FULL" = true ]; then
            if [ "$IS_RELEASE" != true ]; then
              echo "::error::A full release is made only from main."
              exit 1
            fi
            kind=full
          elif [ "$IS_RELEASE" = true ]; then
            kind=prerelease
          else
            kind="test"
          fi
          if [ "$kind" != full ] && [ -n "$VERSION" ]; then
            echo "::warning::The version $VERSION is used only for a full release (release checked)."
          fi
          echo "Kind: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: tool

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          # The Dart of FLUTTER_VERSION. Update the two together.
          sdk: 3.13.5

      - name: Set the version
        id: version
        # A test build gets the name a pre-release would get.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ steps.kind.outputs.kind }}
          BUMP: ${{ inputs.bump || 'minor' }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release list --limit 10000 --exclude-drafts \
            --json tagName,isPrerelease,createdAt > "$RUNNER_TEMP/releases.json"
          # When this job of the run's first attempt started: the releases
          # made since (by this run, or by a later one when an old run is
          # run again) are left out, so every attempt gets the version of
          # the first. A run that waited for another run on main sees that
          # run's release.
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs" \
            --jq '.jobs[] | select(.name == "version") | .started_at')
          if [ -z "$started" ]; then
            echo "::error title=Version::The start of the version job of attempt 1 is not known."
            exit 1
          fi
          options=()
          if [ "$KIND" = full ]; then
            options=(--full --bump "$BUMP" --version "$VERSION")
          fi
          status=0
          dart tool/release_version.dart "$RUNNER_TEMP/releases.json" \
            "$GITHUB_RUN_NUMBER" "$started" "${options[@]}" \
            > "$RUNNER_TEMP/version.txt" 2> "$RUNNER_TEMP/version.err" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=Version::$(cat "$RUNNER_TEMP/version.err")"
            exit 1
          fi
          cat "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Install SQLite
        # The database tests and tool/build_roam_db.dart run on this machine
        # and load the system's libsqlite3.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libsqlite3-dev

      - name: Analyze
        # Issues are also reported as an annotation, so they show on the
        # pull request without opening the log.
        #
        # shell: bash adds -o pipefail. Without it, the status of
        # "flutter analyze | tee" is tee's, always 0, and the step passed
        # with issues. The same holds for the tests below.
        shell: bash
        run: |
          status=0
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.txt" || status=$?
          if [ "$status" -ne 0 ]; then
            issues=$(grep ' • ' "$RUNNER_TEMP/analyze.txt" | sed 's/^ *//' | head -50 | sed ':a;N;$!ba;s/\n/%0A/g' || true)
            echo "::error title=flutter analyze::${issues:-see the log}"
          fi
          exit "$status"

      - name: Test
        shell: bash
        run: |
          status=0
          # The live image tests need real keys; live-images.yml runs them
          # (#168).
          out=""
          for n in $(grep -o "^  testWidgets('[^']*'\|^  test('[^']*'" test/ai/chat_list_screen_test.dart | sed "s/^  [a-zA-Z]*('//;s/'$//" | tr ' ' '#'); do
            name=$(echo "$n" | tr '#' ' ')
            if timeout 60 flutter test test/ai/chat_list_screen_test.dart --plain-name "$name" > "$RUNNER_TEMP/one.txt" 2>&1; then :; else
              out="$out%0AFAIL: $name: $(tr '\r' '\n' < "$RUNNER_TEMP/one.txt" | grep -E -A6 'EXCEPTION|Expected|Actual|Which' | head -12 | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
          done
          echo "::error title=DEBUG list::$out"
          status=1
          if [ "$status" -ne 0 ]; then
            # The compact reporter rewrites its line with carriage returns:
            # make them line breaks, so a failed test's name is found too.
            tr '\r' '\n' < "$RUNNER_TEMP/test.txt" > "$RUNNER_TEMP/test-lines.txt"
            failures=$(grep -E -A 12 '══╡ EXCEPTION|^(Expected|  Actual|   Which):|\[E\]|Test failed|TimeoutException|Some tests failed' "$RUNNER_TEMP/test-lines.txt" | head -80 | sed ':a;N;$!ba;s/\n/%0A/g' || true)
            echo "::error title=flutter test::${failures:-see the log}"
          fi
          exit "$status"

      - name: Compare the parser with org-roam on the sample files
        # The same check as on the laptop (tool/org_roam_parity.py), against
        # the database org-roam built from test/fixtures/roam/.
        run: |
          dart run tool/roam_graph_dump.dart --plain-org-roam test/fixtures/roam > "$RUNNER_TEMP/graph.json"
          python3 tool/org_roam_parity.py compare \
            test/fixtures/org_roam_expected.json "$RUNNER_TEMP/graph.json"

      - name: Compare the app's database with org-roam's on the sample files
        # Every table, every column, as org-roam writes it.
        run: |
          dart run tool/build_roam_db.dart --plain-org-roam test/fixtures/roam "$RUNNER_TEMP/app.db"
          python3 tool/org_roam_parity.py compare-tables \
            test/fixtures/org_roam_expected_tables.json "$RUNNER_TEMP/app.db" \
            test/fixtures/roam

      - name: Write the release notes
        # The CHANGELOG.md entries added since the previous release, then
        # the commit (tool/release_notes.dart, decision 48). The version job
        # chose that release: for a full release the last full release, so
        # the notes hold every change since; for a pre-release the last
        # release of either kind (decision 100). Its changelog is read
        # through the API, so the shallow checkout is enough. Only a 404
        # means "no changelog there"; any other failure stops the build, so
        # no entry is left out.
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          echo "Previous release: ${PREVIOUS:-none}"
          if [ -n "$PREVIOUS" ]; then
            status=0
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GH_REPO/contents/CHANGELOG.md?ref=$PREVIOUS" \
              > "$RUNNER_TEMP/previous-changelog.md" \
              2> "$RUNNER_TEMP/previous-changelog.err" || status=$?
            if [ "$status" -ne 0 ]; then
              rm -f "$RUNNER_TEMP/previous-changelog.md"
              if ! grep -q 'HTTP 404' "$RUNNER_TEMP/previous-changelog.err"; then
                cat "$RUNNER_TEMP/previous-changelog.err"
                echo "::error::Could not read CHANGELOG.md of $PREVIOUS."
                exit 1
              fi
            fi
          fi
          dart tool/release_notes.dart "$RUNNER_TEMP/previous-changelog.md" \
            CHANGELOG.md "${{ github.sha }}" > release-notes.md
          cat release-notes.md

      - name: Load the release key
        if: env.IS_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing. See docs/releases.md."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          # Empty outside main, so Gradle falls back to the debug key.
          ANDROID_KEYSTORE_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.IS_RELEASE == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "roam-graph-${{ needs.version.outputs.name }}.apk"

      - name: Remove the release key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          # release-notes.md exists only for a release.
          path: |
            roam-graph-*.apk
            release-notes.md
          if-no-files-found: error

  linux:
    # The desktop app for Linux (#116): the same code, built on Ubuntu, as
    # a tarball of the bundle. Branches and pull requests build it too, so
    # a change that breaks the desktop shows before it is merged.
    needs: version
    # Not for a pre-release, which carries the APK only (decision 100).
    if: needs.version.outputs.kind != 'prerelease'
    # Pinned: the package names below are those of Ubuntu 24.04.
    runs-on: ubuntu-24.04
    env:
      # GTK for the window, libsecret for the API keys
      # (flutter_secure_storage).
      LINUX_PACKAGES: >-
        clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
        libsecret-1-dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: List the Linux build tools
        # The files apt would download, with their SHA256 from the signed
        # package index; their hash is the cache key. The Ubuntu mirror is
        # sometimes slow (30 MB in 12 minutes instead of 20 seconds), so
        # the files are kept in the cache (#166, decision 99).
        id: apt
        run: |
          sudo apt-get update -q
          tool/apt_cached.sh list $LINUX_PACKAGES > "$RUNNER_TEMP/apt-files.txt"
          echo "key=apt-ubuntu-24.04-$(sha256sum < "$RUNNER_TEMP/apt-files.txt" | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore the cached Linux build tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}
          # A cache of older versions still has most files.
          restore-keys: apt-ubuntu-24.04-

      - name: Install the Linux build tools
        # A cached file is used only if its SHA256 is the index's.
        run: |
          tool/apt_cached.sh install ~/apt-debs "$RUNNER_TEMP/apt-files.txt" \
            $LINUX_PACKAGES

      - name: Build the Linux app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          flutter build linux --release \
            --build-name="$VERSION" \
            --dart-define=APP_VERSION="$VERSION"
          bundle=build/linux/x64/release/bundle
          # The installer, the menu icon and the version go with the app.
          cp linux/packaging/install.sh "$bundle/"
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            "$bundle/roam-graph.png"
          echo "Roam Graph $VERSION" > "$bundle/VERSION"
          tar -C build/linux/x64/release -czf \
            "roam-graph-$VERSION-linux-x64.tar.gz" bundle
          # install.sh --update accepts only plain files and folders under
          # bundle/: checked here, so a release it would refuse is not made.
          if tar -tvzf "roam-graph-$VERSION-linux-x64.tar.gz" | grep -E '^[^-d]'; then
            echo "::error::The Linux package holds links; install.sh --update would refuse it."
            exit 1
          fi

      - name: Keep the Linux app as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: roam-graph-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    # The desktop app for Windows (#116), as a zip of the Release folder.
    needs: version
    # Not for a pre-release, which carries the APK only (decision 100).
    if: needs.version.outputs.kind != 'prerelease'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the Windows app
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION" `
            --dart-define=APP_VERSION="$env:VERSION"
          $out = "build/windows/x64/runner/Release"
          # The Visual C++ runtime goes with the app, so it starts on a
          # Windows without the redistributable.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $out
          }
          "Roam Graph $env:VERSION" | Out-File -Encoding utf8 "$out/VERSION.txt"
          Compress-Archive -Path "$out/*" `
            -DestinationPath "roam-graph-$env:VERSION-windows-x64.zip"

      - name: Keep the Windows app as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: roam-graph-*-windows-x64.zip
          if-no-files-found: error

  macos:
    # The desktop app for macOS (#116), as a zip of the app. Not signed:
    # macOS asks once before it opens.
    needs: version
    # Not for a pre-release, which carries the APK only (decision 100).
    if: needs.version.outputs.kind != 'prerelease'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the macOS app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          flutter build macos --release \
            --build-name="$VERSION" \
            --dart-define=APP_VERSION="$VERSION"
          cd build/macos/Build/Products/Release
          # The one app the build made, whatever its product name.
          app=$(ls -d *.app | head -n 1)
          [ -n "$app" ] || { echo "::error::No .app was built."; exit 1; }
          # ditto keeps the app's links and attributes, as Finder's zip.
          ditto -c -k --keepParent "$app" \
            "$GITHUB_WORKSPACE/roam-graph-$VERSION-macos.zip"

      - name: Keep the macOS app as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: roam-graph-*-macos.zip
          if-no-files-found: error

  org-roam:
    # Rebuilds the expected data from the sample files with real org-roam
    # and checks it matches the committed file, so the parser is compared
    # with org-roam itself. Ubuntu 24.04 brings Emacs 29 and Org 9.6, the
    # versions the expectations were made with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Emacs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends emacs-nox

      - name: Rebuild the expected data with org-roam
        run: tool/org_roam_parity/build-fixture-expectations.sh

      - name: Check it matches the committed data
        run: |
          git diff --exit-code test/fixtures/org_roam_expected.json \
            test/fixtures/org_roam_expected_tables.json

  live-check:
    # Whether image code changed since the previous full release (#168):
    # the live image tests run at a full release only then.
    needs: version
    if: needs.version.outputs.kind == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Compare with the previous full release
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "No previous release: the live image tests run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GH_REPO/compare/$PREVIOUS...$GITHUB_SHA" \
            --jq '.files[].filename' > "$RUNNER_TEMP/changed-files.txt"
          # The compare API names at most 300 files: a longer list may be
          # cut, so then the tests run.
          if [ "$(wc -l < "$RUNNER_TEMP/changed-files.txt")" -ge 300 ]; then
            echo "Many files changed since $PREVIOUS: the live image tests run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -E '^(lib/ai/ai_images\.dart|lib/ai/ai_providers\.dart|test/live/)' \
              "$RUNNER_TEMP/changed-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image code did not change since $PREVIOUS: no live image tests."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  live-images:
    # Warn only: the release is published whatever this finds (#168).
    needs: [version, live-check]
    if: needs.live-check.outputs.changed == 'true'
    # The called workflow may open an issue in other runs, so it asks for
    # issues: write; here it does not use it (warn-only).
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/live-images.yml
    with:
      warn-only: true
    secrets: inherit

  release:
    needs: [version, build, linux, windows, macos, org-roam, live-check, live-images]
    # A pre-release needs build and org-roam; a full release all jobs. The
    # desktop jobs are skipped for a pre-release, and a skipped job would
    # skip this one without !cancelled().
    if: >-
      !cancelled()
      && (needs.version.outputs.kind == 'prerelease' || needs.version.outputs.kind == 'full')
      && needs.build.result == 'success'
      && needs.org-roam.result == 'success'
      && (needs.version.outputs.kind == 'prerelease' || needs.live-check.result == 'success')
      && (needs.version.outputs.kind == 'prerelease'
          || (needs.linux.result == 'success'
              && needs.windows.result == 'success'
              && needs.macos.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.kind == 'full'
        with:
          name: linux

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.kind == 'full'
        with:
          name: windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.kind == 'full'
        with:
          name: macos

      - name: Publish the GitHub release
        # A new release starts as a draft with its files attached and is
        # published only after that, so Obtainium never sees a release
        # without an APK. Safe to re-run: an existing release (draft or
        # published) is reused, its files and text replaced, and then
        # published. The text comes from CHANGELOG.md (decision 48). A
        # pre-release carries the APK only and is marked as pre-release,
        # so GitHub never makes it the latest release (decision 100).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ needs.version.outputs.kind }}
          TAG: v${{ needs.version.outputs.name }}
          APK: roam-graph-${{ needs.version.outputs.name }}.apk
          LINUX: roam-graph-${{ needs.version.outputs.name }}-linux-x64.tar.gz
          WINDOWS: roam-graph-${{ needs.version.outputs.name }}-windows-x64.zip
          MACOS: roam-graph-${{ needs.version.outputs.name }}-macos.zip
          LIVE_FAILED: ${{ needs.live-images.outputs.failed }}
          LIVE_URL: ${{ needs.live-images.outputs.url }}
        run: |
          if [ -n "$LIVE_FAILED" ]; then
            # Warn only (#168): the release is made, its notes say so.
            {
              echo "Live image test failed: $LIVE_FAILED (see run $LIVE_URL)"
              echo
              cat release-notes.md
            } > "$RUNNER_TEMP/notes.md"
            mv "$RUNNER_TEMP/notes.md" release-notes.md
          fi
          files=("$APK")
          mark=(--prerelease)
          if [ "$KIND" = full ]; then
            files+=("$LINUX" "$WINDOWS" "$MACOS")
            mark=(--prerelease=false)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" "${mark[@]}" --notes-file release-notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --draft \
              "${mark[@]}" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false
